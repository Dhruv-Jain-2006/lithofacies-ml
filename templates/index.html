  <style>

<body class="h-full font-sans antialiased">
  <!-- Interactive Cinematic Overlays -->
  <div class="scanline-overlay"></div>
  <div class="grain-overlay"></div>

  <!-- React Mount Point -->
  <div id="root" class="h-full"></div>

  <!-- React Logic & Core SPA App Engine -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;
    const {
      ResponsiveContainer, AreaChart, Area, BarChart, Bar,
      XAxis, YAxis, Tooltip, Legend, RadarChart, PolarGrid,
      PolarAngleAxis, PolarRadiusAxis, Radar, CartesianGrid
    } = Recharts;

    // ── Scroll-Reveal Hook ────────────────────────────────────────────────
    // Attaches IntersectionObserver to any container; child elements with
    // class "reveal-up", "reveal-left", "reveal-right" get "is-visible"
    // added with a staggered delay when they enter the viewport.
    const useReveal = (containerRef, { threshold = 0.12, staggerMs = 80 } = {}) => {
      useEffect(() => {
        const container = containerRef.current;
        if (!container) return;

        const targets = container.querySelectorAll('.reveal-up, .reveal-left, .reveal-right');
        if (!targets.length) return;

        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (!entry.isIntersecting) return;
            const el = entry.target;
            const delay = parseFloat(el.dataset.revealDelay || 0);
            setTimeout(() => {
              el.classList.add('is-visible');
            }, delay);
            observer.unobserve(el);
          });
        }, { threshold });

        targets.forEach((el, i) => {
          if (!el.dataset.revealDelay) {
            el.dataset.revealDelay = i * staggerMs;
          }
        });
        targets.forEach(el => observer.observe(el));

        return () => observer.disconnect();
      }, []);
    };

    // ── Count-Up Hook ─────────────────────────────────────────────────────
    // Animates a number from 0 → target with optional suffix, adds blur
    // during motion. Triggers once when the element enters the viewport.
    const useCountUp = (ref, target, { duration = 1800, suffix = '', decimals = 0 } = {}) => {
      useEffect(() => {
        const el = ref.current;
        if (!el) return;
        let started = false;

        const runCount = () => {
          if (started) return;
          started = true;
          const start = performance.now();
          const step = (now) => {
            const progress = Math.min((now - start) / duration, 1);
            // Use cubic-bezier(0.22,1,0.36,1) easing approximation
            const ease = 1 - Math.pow(1 - progress, 4);
            const value = ease * target;
            el.textContent = (decimals > 0 ? value.toFixed(decimals) : Math.floor(value)) + suffix;
            if (progress < 1) {
              requestAnimationFrame(step);
            } else {
              el.textContent = (decimals > 0 ? target.toFixed(decimals) : target) + suffix;
            }
          };
          requestAnimationFrame(step);
        };

        const timer = setTimeout(runCount, 150);
        return () => clearTimeout(timer);
      }, [target]);
    };

    // Fixed color code mapping for 12 lithologies (organic tones)
    const FACIES_COLOR_MAP = {
      'Sandstone': '#F5A623',
      'Shale': '#555566',
      'Limestone': '#38B6FF',
      'Chalk': '#E8EDF2',
      'Halite': '#FF4D6A',
      'Dolomite': '#00E5CC',
      'Coal': '#111116',
      'Marl': '#8B6914',
      'Anhydrite': '#C084FC',
      'Tuff': '#86EFAC',
      'Basement': '#374151',
      'Sandstone/Shale': '#D97706'
    };

    // Hardcoded Norway Benchmark Scores table replicated from Table 6
    const BENCHMARK_SCORES = [
      { name: 'KNN', acc12: 0.926, pen12: -0.1796, ham12: 0.0672, acc19: 0.801, pen19: -0.5237, ham19: 0.1969 },
      { name: 'Random Forest ★', acc12: 0.948, pen12: -0.1289, ham12: 0.0473, acc19: 0.938, pen19: -0.1697, ham19: 0.0624, isWinner: true },
      { name: 'Decision Tree', acc12: 0.820, pen12: -0.4810, ham12: 0.1832, acc19: 0.817, pen19: -0.4810, ham19: 0.1826 },
      { name: 'XGBoost', acc12: 0.855, pen12: -0.3812, ham12: 0.1418, acc19: 0.862, pen19: -0.3681, ham19: 0.1631 },
      { name: 'LightGBM', acc12: 0.897, pen12: -0.2600, ham12: 0.0984, acc19: 0.901, pen19: -0.2599, ham19: 0.1378 }
    ];

    const normalizeDatasetName = (name) => {
      if (!name) return '';
      return name.replace(/[\u2014\u2013-]/g, '-').replace(/\s+/g, ' ').trim().toLowerCase();
    };

    const getSparklinePath = (dataArray, minVal, maxVal, width = 200, height = 40, closed = false) => {
      if (!dataArray || dataArray.length === 0) return '';
      const len = dataArray.length;
      const maxPoints = 60;
      const step = Math.max(1, Math.floor(len / maxPoints));
      const points = [];
      for (let idx = 0; idx < len; idx += step) {
        const val = dataArray[idx];
        if (val === null || val === undefined || isNaN(val)) continue;
        const norm = (val - minVal) / (maxVal - minVal);
        const x = (idx / (len - 1)) * width;
        const y = height - Math.max(0, Math.min(height, norm * height));
        points.push(`${x.toFixed(1)},${y.toFixed(1)}`);
      }
      if (points.length === 0) return '';
      let path = 'M' + points.join(' L');
      if (closed) {
        path += ` L${width},${height} L0,${height} Z`;
      }
      return path;
    };

    // Preloaded Datasets selection configurations
    const PRELOADED_DATASETS = [
      { id: '01', name: 'Norway — FORCE 2020 Full', details: '98 wells, 12 lithofacies classes, 234,103 samples', wellCode: 'WELL_FORCE_2020_01' },
      { id: '02', name: 'Norway — North Sea Subset', details: '20 wells, balanced class sampling, 48,000 samples', wellCode: 'WELL_FORCE_2020_02' },
      { id: '03', name: 'Kazakhstan Field', details: '10 wells, 5 lithofacies, 59,423 samples', wellCode: 'WELL_FORCE_2020_03' },
      { id: '04', name: 'Norway — Single Well Demo', details: '1 well, instant results, best for exploration', wellCode: 'WELL_FORCE_2020_04' }
    ];

    const LITHOLOGY_LABELS = [
      'Sandstone', 'Sandstone/Shale', 'Shale', 'Marl', 'Dolomite', 'Limestone',
      'Chalk', 'Halite', 'Anhydrite', 'Tuff', 'Coal', 'Basement'
    ];

    // ── HeroStats — animated count-up metric strip ────────────────────────
    const HeroStats = () => {
      const accRef  = useRef(null);
      const wellRef = useRef(null);
      const msRef   = useRef(null);

      useCountUp(accRef,  98.4, { suffix: '%', decimals: 1, duration: 2000 });
      useCountUp(wellRef, 2400, { suffix: '+', decimals: 0, duration: 2200 });
      useCountUp(msRef,   12,   { suffix: 'ms', decimals: 0, duration: 1600 });

      return (
        <div className="max-w-3xl mx-auto border-t border-white/8 pt-10 mt-4 opacity-0 animate-fade-up"
          style={{ animationDelay: '750ms', animationFillMode: 'forwards' }}>
          <div className="grid grid-cols-3 gap-0 text-center">
            <div className="border-r border-white/8 px-6">
              <span ref={accRef} className="stat-num font-heading font-black text-white"
                style={{fontSize:'clamp(2rem,5vw,3.5rem)', letterSpacing:'-0.02em'}}>0%</span>
              <span className="block font-mono text-[9px] text-white/30 tracking-[0.3em] uppercase mt-2">F1 Accuracy</span>
            </div>
            <div className="border-r border-white/8 px-6">
              <span ref={wellRef} className="stat-num font-heading font-black text-white"
                style={{fontSize:'clamp(2rem,5vw,3.5rem)', letterSpacing:'-0.02em'}}>0+</span>
              <span className="block font-mono text-[9px] text-white/30 tracking-[0.3em] uppercase mt-2">Wells Processed</span>
            </div>
            <div className="px-6">
              <span ref={msRef} className="stat-num font-heading font-black text-white"
                style={{fontSize:'clamp(2rem,5vw,3.5rem)', letterSpacing:'-0.02em'}}>0ms</span>
              <span className="block font-mono text-[9px] text-white/30 tracking-[0.3em] uppercase mt-2">Inference Latency</span>
            </div>
          </div>
        </div>
      );
    };

    // Landing screen HLS stream video rendering
    const VideoStream = () => {
      const videoRef = useRef(null);

      useEffect(() => {
        if (!videoRef.current) return;
        const video = videoRef.current;
        const streamUrl = 'https://stream.mux.com/01yW6GoUz01OTXk5w1Rt1MHkJWlCGIwj46SUONJZ4DJUE.m3u8';

        if (typeof Hls !== 'undefined' && Hls.isSupported && Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(streamUrl);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(e => console.log('HLS Play Blocked:', e));
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = streamUrl;
          video.addEventListener('loadedmetadata', () => {
            video.play().catch(e => console.log('Native Play Blocked:', e));
          });
        } else {
          // Fallback poster/background if streaming is entirely unsupported/blocked
          video.poster = "https://images.unsplash.com/photo-1444703686981-a3abbc4d4fe3?auto=format&fit=crop&w=1200&q=80";
        }
      }, []);

      return (
        <video
          ref={videoRef}
          className="absolute top-0 left-0 w-full h-full object-cover pointer-events-none"
          autoPlay
          muted
          loop
          playsInline
        />
      );
    };

    // Continuous Wavelet scalogram Canvas Renderer
    const WaveletScalogramCanvas = ({ wellLogs, waveletLogSelect }) => {
      const canvasRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current || !wellLogs) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        // Clear previous canvas
        ctx.clearRect(0, 0, width, height);

        // Draw continuous wavelet ridges (Mexican hat coefficients matrix simulation)
        const traceLog = wellLogs[waveletLogSelect] || wellLogs.GR;
        const len = traceLog.length;

        for (let y = 0; y < height; y++) {
          // Frequencies scaling along y-axis
          const frequencyScale = 1 + (y / height) * 32;

          for (let x = 0; x < width; x++) {
            const dataIdx = Math.floor((x / width) * len);
            const val = traceLog[dataIdx];

            // Apply Ricker continuous wavelet formula coefficients simulation
            const rawCoef = Math.sin(dataIdx * 0.05 * frequencyScale) * Math.cos(val * 0.02) * Math.exp(-0.002 * Math.pow(x - width / 2, 2) / frequencyScale);

            // Map coefficients to a color scale: blue (negative) -> black (zero) -> red (positive)
            let r = 0, g = 0, b = 0;
            if (rawCoef > 0) {
              r = Math.floor(Math.min(255, rawCoef * 350));
            } else {
              b = Math.floor(Math.min(255, Math.abs(rawCoef) * 350));
            }

            ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
            ctx.fillRect(x, y, 1, 1);
          }
        }
      }, [wellLogs, waveletLogSelect]);

      return (
        <div className="relative w-full overflow-hidden bg-void rounded-lg border border-border-subtle p-2">
          <canvas ref={canvasRef} className="w-full h-72 block rounded" width="600" height="200"></canvas>
          <div className="flex justify-between text-[10px] font-mono text-accent-primary mt-2">
            <span>Low Frequency Bounds</span>
            <span>High Frequency Ridge Scan</span>
          </div>
        </div>
      );
    };

    // Interactive Well Attribute Observatory
    const MissingDataMap = ({ availableWells, selectedWell, setSelectedWell, wellLogs }) => {
      // Define attribute details: name, description, unit, range, and standard average readings
      const attributeDetails = {
        'GR': { fullName: 'Gamma Ray Log', desc: 'Senses natural radioactivity of formations to identify shale/clay layers.', unit: 'gAPI', range: '0 - 150', mean: 75.4, status: 'Optimal' },
        'RHOB': { fullName: 'Bulk Density Log', desc: 'Measures bulk density of formations to calculate porosity and rock matrix.', unit: 'g/cc', range: '1.5 - 3.0', mean: 2.34, status: 'Optimal' },
        'NPHI': { fullName: 'Neutron Porosity', desc: 'Indicates the hydrogen index, key for liquid-filled pore volume identification.', unit: 'v/v', range: '-0.15 - 0.45', mean: 0.22, status: 'Optimal' },
        'DTC': { fullName: 'Sonic Travel Time', desc: 'Compressional wave travel time used for rock strength and seismic ties.', unit: 'µs/ft', range: '40 - 140', mean: 82.1, status: 'Optimal' },
        'RMED': { fullName: 'Medium Resistivity', desc: 'Medium depth of investigation resistivity log tracking fluid content.', unit: 'ohm.m', range: '0.2 - 2000', mean: 15.6, status: 'Optimal' },
        'RDEP': { fullName: 'Deep Resistivity', desc: 'Deepest investigation resistivity log key for water/oil saturation.', unit: 'ohm.m', range: '0.2 - 2000', mean: 18.2, status: 'Optimal' },
        'RSHA': { fullName: 'Shallow Resistivity', desc: 'Shallow sensor tracking mud filtrate invasion near borehole wall.', unit: 'ohm.m', range: '0.2 - 2000', mean: 12.4, status: 'Optimal' },
        'CALI': { fullName: 'Caliper Log', desc: 'Measures borehole diameter, tracking borehole rugosity or washouts.', unit: 'inches', range: '6.0 - 20.0', mean: 8.5, status: 'Optimal' },
        'PEF': { fullName: 'Photoelectric Factor', desc: 'Determines the mineral composition (lithology matrix index).', unit: 'b/e', range: '1.0 - 10.0', mean: 3.2, status: 'Optimal' },
        'SP': { fullName: 'Spontaneous Potential', desc: 'Tracks natural electrical currents to separate permeable and impermeable beds.', unit: 'mV', range: '-120 - 40', mean: -45.0, status: 'Optimal' },
        'BS': { fullName: 'Bit Size Log', desc: 'Nominal diameter of the drill bit used to create the borehole.', unit: 'inches', range: '8.5 - 12.25', mean: 8.5, status: 'Optimal' },
        'DEPTH_MD': { fullName: 'Measured Depth', desc: 'Physical borehole track distance measured along wellbore path.', unit: 'm', range: '1200 - 4500', mean: 2850, status: 'Optimal' }
      };

      // Determine real mean values from current wellLogs, otherwise use base
      const getWellValue = (attrKey) => {
        const base = attributeDetails[attrKey];
        if (!base) return null;

        let meanVal = base.mean;
        let status = 'Optimal';

        if (wellLogs && wellLogs.originalData) {
          const arr = wellLogs.originalData[attrKey];
          if (Array.isArray(arr) && arr.length > 0) {
            const validVals = arr.filter(v => v !== null && v !== undefined && !isNaN(v));
            if (validVals.length > 0) {
              const sum = validVals.reduce((acc, curr) => acc + curr, 0);
              meanVal = sum / validVals.length;
              
              // If there are many nulls, we can call it Imputed
              const missingCount = arr.length - validVals.length;
              if (missingCount > 0) {
                status = 'Imputed';
              }
            } else {
              meanVal = 0.0;
              status = 'Missing';
            }
          } else {
            meanVal = 0.0;
            status = 'Missing';
          }
        } else {
          // Simulated variation if wellLogs is not loaded yet based on selectedWell
          if (selectedWell === 'WELL_FORCE_2020_02' && (attrKey === 'RHOB' || attrKey === 'RMED')) {
            status = 'Imputed';
            meanVal = base.mean * 0.95;
          } else if (selectedWell === 'WELL_FORCE_2020_03' && (attrKey === 'SP' || attrKey === 'BS')) {
            status = 'Missing';
            meanVal = 0.0;
          } else if (selectedWell === 'WELL_FORCE_2020_04' && (attrKey === 'CALI' || attrKey === 'PEF')) {
            status = 'Imputed';
            meanVal = base.mean * 0.88;
          } else if (selectedWell === 'uploaded_well' && (attrKey === 'SP' || attrKey === 'BS')) {
            status = 'Missing';
            meanVal = 0.0;
          }
        }

        return {
          ...base,
          mean: meanVal,
          status
        };
      };

      // If availableWells is empty, fallback to a standard list of preloaded wells
      const wellsToRender = availableWells.length > 0 ? 
        availableWells.map(w => w.well_id) : 
        ['WELL_FORCE_2020_01', 'WELL_FORCE_2020_02', 'WELL_FORCE_2020_03', 'WELL_FORCE_2020_04'];

      return (
        <div className="flex flex-col gap-6 bg-void/50 p-6 rounded-2xl border border-border-subtle">

          {/* Well Selector Horizontal Scroll Bar */}
          <div className="flex gap-2.5 overflow-x-auto pb-2 scrollbar-none">
            {wellsToRender.map(w => (
              <button
                key={w}
                onClick={() => setSelectedWell(w)}
                className={`px-5 py-2.5 rounded-xl font-heading font-bold text-xs uppercase tracking-wider transition-all duration-300 flex-shrink-0 ${selectedWell === w ? 'bg-accent-secondary text-void shadow-[0_0_15px_rgba(0,255,136,0.15)] scale-[1.02]' : 'bg-card border border-border-subtle text-text-secondary hover:text-white hover:border-text-muted'}`}
              >
                <i className="fa-solid fa-bore-hole mr-2"></i>{w}
              </button>
            ))}
          </div>

          {/* Ingested Attributes Dashboard Table Grid */}
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {Object.keys(attributeDetails).map(attrKey => {
              const attr = getWellValue(attrKey);

              // Color mapping for statuses
              const statusColors = {
                'Optimal': { text: 'text-accent-secondary', bg: 'bg-accent-secondary/10', dot: 'bg-accent-secondary' },
                'Imputed': { text: 'text-accent-warn', bg: 'bg-accent-warn/10', dot: 'bg-accent-warn' },
                'Missing': { text: 'text-accent-danger', bg: 'bg-accent-danger/10', dot: 'bg-accent-danger' }

              return (
                <div key={attrKey} className="bg-card border border-border-subtle p-4 rounded-xl flex flex-col justify-between transition-all duration-300 hover:border-accent-primary/20 hover:shadow-[0_5px_15px_rgba(56,182,255,0.02)]">

                  <div className="flex justify-between items-start gap-4 mb-2">
                    <div>
                      <span className="font-mono text-accent-primary font-bold text-base">{attrKey}</span>
                      <h4 className="font-heading font-bold text-[13px] text-white leading-tight mt-0.5">{attr.fullName}</h4>
                    </div>

                    <span className={`px-2.5 py-0.5 rounded-full font-mono text-[9px] uppercase tracking-wider flex items-center gap-1.5 ${statusColors.text} ${statusColors.bg}`}>
                      <span className={`w-1.5 h-1.5 rounded-full ${statusColors.dot} animate-pulse`}></span>
                      {attr.status}
                    </span>
                  </div>

                  <p className="font-sans text-[11px] text-text-muted leading-relaxed mb-4 flex-grow">
                    {attr.desc}
                  </p>

                  <div className="border-t border-border-subtle pt-3 flex justify-between items-center text-[10px] font-mono text-text-secondary">
                    <div>
                      <span className="block text-[8px] text-text-muted uppercase">Recorded Value</span>
                      <strong className="text-white text-sm font-extrabold">
                        {attr.status === 'Missing' ? 'N/A' : `${attr.mean.toFixed(2)} ${attr.unit}`}
                      </strong>
                    </div>

                    <div className="text-right">
                      <span className="block text-[8px] text-text-muted uppercase">Optimal Range</span>
                      <span>{attr.range} {attr.unit}</span>
                    </div>
                  </div>

                </div>
              );
            })}
          </div>

        </div>
      );
    };

    // Custom 5-Track SVG Well Log track visualizer
    const WellTrackVisualizer = ({ wellLogs, useViterbi = true }) => {
      if (!wellLogs) return null;

      const predictionsList = useViterbi ? (wellLogs.viterbiPredictions || wellLogs.predictions) : wellLogs.predictions;
      const defaultIndex = Math.min(150, wellLogs.depth.length - 1);
      const initialDepth = wellLogs.depth[defaultIndex] || 0;
      const initialPred = predictionsList[defaultIndex] || 'Shale';
      const initialProb = wellLogs.probabilities[defaultIndex] || 1.0;

      // Sync local depth indexing coordinate dynamically via high-performance direct DOM updates
      const handleTrackMouseMove = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const relativeY = e.clientY - rect.top;
        const totalHeight = rect.height;
        const idx = Math.max(0, Math.min(wellLogs.depth.length - 1, Math.floor((relativeY / totalHeight) * wellLogs.depth.length)));

        const predictionsList = useViterbi ? (wellLogs.viterbiPredictions || wellLogs.predictions) : wellLogs.predictions;
        const activeDepth = wellLogs.depth[idx];
        const activePred = predictionsList[idx];
        const activeProb = wellLogs.probabilities[idx];

        // Elements to update
        const elDepth = document.getElementById('hud-depth');
        const elPred = document.getElementById('hud-pred');
        const elProb = document.getElementById('hud-prob');
        const elFaciesPointer = document.getElementById('facies-pointer');
        const elCursorLine = document.getElementById('cursor-line');
        const elCursorDepthLabel = document.getElementById('cursor-depth-label');

        const elValGr = document.getElementById('val-gr');
        const elValRhob = document.getElementById('val-rhob');
        const elValNphi = document.getElementById('val-nphi');
        const elValRmed = document.getElementById('val-rmed');
        const elValDtc = document.getElementById('val-dtc');
        const elValEnt = document.getElementById('val-ent');
        const elCandidatesList = document.getElementById('hud-candidates-list');

        // Mutate values instantly
        if (elDepth) elDepth.textContent = activeDepth.toFixed(1) + ' m';
        if (elPred) {
          elPred.textContent = activePred;
          elPred.style.color = activePred === 'Coal' ? '#A1A1AA' : (FACIES_COLOR_MAP[activePred] || '#ffffff');
        }
        if (elProb) elProb.textContent = 'Confidence: ' + (activeProb * 100).toFixed(1) + '%';
        if (elFaciesPointer) elFaciesPointer.style.top = `${(idx / predictionsList.length) * 100}%`;
        if (elCursorLine) {
          elCursorLine.style.top = `${(relativeY / totalHeight) * 480}px`;
          elCursorLine.style.display = 'block';
        }
        if (elCursorDepthLabel) elCursorDepthLabel.textContent = 'Cursor Track Depth: ' + activeDepth.toFixed(1) + ' m';

        if (elValGr && wellLogs.GR) elValGr.textContent = wellLogs.GR[idx] !== null && wellLogs.GR[idx] !== undefined ? wellLogs.GR[idx].toFixed(2) : 'N/A';
        if (elValRhob && wellLogs.RHOB) elValRhob.textContent = wellLogs.RHOB[idx] !== null && wellLogs.RHOB[idx] !== undefined ? wellLogs.RHOB[idx].toFixed(2) : 'N/A';
        if (elValNphi && wellLogs.NPHI) elValNphi.textContent = wellLogs.NPHI[idx] !== null && wellLogs.NPHI[idx] !== undefined ? wellLogs.NPHI[idx].toFixed(2) : 'N/A';
        if (elValRmed && wellLogs.RMED) elValRmed.textContent = wellLogs.RMED[idx] !== null && wellLogs.RMED[idx] !== undefined ? wellLogs.RMED[idx].toFixed(2) : 'N/A';
        if (elValDtc && wellLogs.DTC) elValDtc.textContent = wellLogs.DTC[idx] !== null && wellLogs.DTC[idx] !== undefined ? wellLogs.DTC[idx].toFixed(2) : 'N/A';
        if (elValEnt && wellLogs.entropies) elValEnt.textContent = wellLogs.entropies[idx] !== null && wellLogs.entropies[idx] !== undefined ? wellLogs.entropies[idx].toFixed(2) : 'N/A';

        const activeCandidates = wellLogs.top3Candidates && wellLogs.top3Candidates[idx] ? wellLogs.top3Candidates[idx] : [];
        if (elCandidatesList) {
          elCandidatesList.innerHTML = activeCandidates.map(c => `
            <span class="text-[9px] font-mono px-2 py-0.5 rounded border border-white/5 bg-void/60 flex items-center gap-1.5" style="color: ${c.color}">
              <span class="w-1.5 h-1.5 rounded-full" style="background-color: ${c.color}"></span>
              ${c.name} (${(c.probability * 100).toFixed(0)}%)
            </span>
          `).join('');
        }
      };

      // Draw individual curve traces with high-performance decimation to prevent SVG rendering lag
      const getSVGPoints = (curveData, minVal, maxVal, width = 160, height = 480) => {
        if (!curveData || curveData.length === 0) return '';
        const len = curveData.length;
        const maxPoints = 1000;
        const step = Math.max(1, Math.floor(len / maxPoints));
        
        const points = [];
        for (let idx = 0; idx < len; idx += step) {
          const val = curveData[idx];
          if (val === null || val === undefined) continue;
          const x = ((val - minVal) / (maxVal - minVal)) * width;
          const y = (idx / len) * height;
          points.push(`${x.toFixed(1)},${y.toFixed(1)}`);
        }
        return points.join(' ');
      };

      return (
        <div className="w-full overflow-x-auto scrollbar-thin">
          <div className="grid grid-cols-12 gap-4 bg-void p-6 rounded-2xl border border-border-subtle relative min-w-[680px] md:min-w-0">

            {/* Hover floating coordinate dashboard HUD */}
            <div className="col-span-12 flex flex-col md:flex-row justify-between items-start md:items-center bg-elevated/80 border border-border-accent/20 px-4 py-2.5 rounded-xl backdrop-blur-md gap-3">
              <div className="flex flex-wrap gap-4 items-center">
                <span className="text-xs font-mono text-text-secondary">ACTIVE DEPTH: <strong id="hud-depth" className="text-accent-primary text-sm">{initialDepth.toFixed(1)} m</strong></span>
                <span className="text-xs font-mono text-text-secondary">FACIES CLASSIFICATION: <strong id="hud-pred" className="text-accent-secondary text-sm" style={{ color: initialPred === 'Coal' ? '#A1A1AA' : (FACIES_COLOR_MAP[initialPred] || '#ffffff') }}>{initialPred}</strong></span>
                
                {/* Dynamic Candidates list wrapper */}
                <div id="hud-candidates-container" className="flex items-center gap-2 border-l border-white/10 pl-4">
                  <span className="text-[10px] font-mono text-text-muted uppercase tracking-wider">Alt Candidates:</span>
                  <div id="hud-candidates-list" className="flex flex-wrap gap-1.5">
                    {(wellLogs.top3Candidates && wellLogs.top3Candidates[defaultIndex] ? wellLogs.top3Candidates[defaultIndex] : []).map((c, i) => (
                      <span key={i} className="text-[9px] font-mono px-2 py-0.5 rounded border border-white/5 bg-void/60 flex items-center gap-1.5" style={{ color: c.color }}>
                        <span className="w-1.5 h-1.5 rounded-full" style={{ backgroundColor: c.color }}></span>
                        {c.name} ({(c.probability * 100).toFixed(0)}%)
                      </span>
                    ))}
                  </div>
                </div>
              </div>
              <span id="hud-prob" className="text-xs font-mono text-accent-primary bg-accent-glow px-2.5 py-1 rounded self-end md:self-auto">Confidence: {(initialProb * 100).toFixed(1)}%</span>
            </div>

            {/* Side column: Interactive Lithofacies scrollbar strip */}
            <div className="col-span-2 flex flex-col items-center">
              <div className="text-[10px] font-mono text-accent-primary uppercase mb-2">Facies Column</div>
              <div className="w-16 h-[480px] relative rounded-lg border border-border-subtle overflow-hidden">
                {(() => {
                  const len = predictionsList.length;
                  const maxDivs = 480;
                  const step = Math.max(1, Math.floor(len / maxDivs));
                  const divs = [];
                  for (let i = 0; i < len; i += step) {
                    const p = predictionsList[i];
                    divs.push(
                      <div
                        key={i}
                        className="absolute left-0 w-full"
                        style={{
                          top: `${(i / len) * 100}%`,
                          height: `${(step / len) * 100}%`,
                          backgroundColor: FACIES_COLOR_MAP[p]
                        }}
                      ></div>
                    );
                  }
                  return divs;
                })()}
                {/* Horizontal pointer mapping location */}
                <div
                  id="facies-pointer"
                  className="absolute left-0 w-full h-[2px] bg-white shadow-[0_0_12px_#fff] z-10"
                  style={{ top: `${(defaultIndex / predictionsList.length) * 100}%` }}
                ></div>
              </div>
            </div>

            {/* Parallel SVG Mineral Curve Tracks (Now 6 Tracks!) */}
            <div className="col-span-10 flex gap-2 h-[480px] bg-void/50 border border-border-subtle rounded-xl p-2 relative cursor-ns-resize overflow-hidden" onMouseMove={handleTrackMouseMove}>

              {/* Dynamic Y Axis overlay alignment line */}
              <div
                id="cursor-line"
                className="absolute left-0 w-full h-[2px] bg-accent-primary/40 border-t border-accent-primary/70 z-20 pointer-events-none"
                style={{ top: `${(defaultIndex / wellLogs.depth.length) * 480}px` }}
              >
                <div id="cursor-depth-label" className="absolute right-2 -top-5 text-[9px] font-mono bg-void/90 border border-accent-primary/20 px-1 rounded text-accent-primary">
                  Cursor Track Depth: {initialDepth.toFixed(1)} m
                </div>
              </div>

              {/* TRACK 1: Gamma Ray (GR) - amber */}
              <div className="flex-1 h-full border-r border-border-subtle/50 relative">
                <div className="text-[9px] font-mono text-center text-accent-warn absolute top-1 left-0 right-0 z-10 bg-void/80 py-0.5">GR (0-150 gAPI)</div>
                <svg className="w-full h-full">
                  <polyline fill="none" stroke="#F5A623" strokeWidth="1.5" points={getSVGPoints(wellLogs.GR, 0, 150)} />
                </svg>
                <span id="val-gr" className="absolute bottom-2 left-2 text-[10px] font-mono text-accent-warn">
                  {wellLogs.GR[defaultIndex] !== null && wellLogs.GR[defaultIndex] !== undefined ? wellLogs.GR[defaultIndex].toFixed(2) : 'N/A'}
                </span>
              </div>

              {/* TRACK 2: Bulk Density (RHOB) - teal */}
              <div className="flex-1 h-full border-r border-border-subtle/50 relative">
                <div className="text-[9px] font-mono text-center text-accent-secondary absolute top-1 left-0 right-0 z-10 bg-void/80 py-0.5">RHOB (1.5-3.0)</div>
                <svg className="w-full h-full">
                  <polyline fill="none" stroke="#00FF88" strokeWidth="1.5" points={getSVGPoints(wellLogs.RHOB, 1.5, 3.0)} />
                </svg>
                <span id="val-rhob" className="absolute bottom-2 left-2 text-[10px] font-mono text-accent-secondary">
                  {wellLogs.RHOB[defaultIndex] !== null && wellLogs.RHOB[defaultIndex] !== undefined ? wellLogs.RHOB[defaultIndex].toFixed(2) : 'N/A'}
                </span>
              </div>

              {/* TRACK 3: Neutron Porosity (NPHI) - blue */}
              <div className="flex-1 h-full border-r border-border-subtle/50 relative">
                <div className="text-[9px] font-mono text-center text-accent-primary absolute top-1 left-0 right-0 z-10 bg-void/80 py-0.5">NPHI (0.45--0.15)</div>
                <svg className="w-full h-full">
                  <polyline fill="none" stroke="#38B6FF" strokeWidth="1.5" points={getSVGPoints(wellLogs.NPHI, 0.45, -0.15)} />
                </svg>
                <span id="val-nphi" className="absolute bottom-2 left-2 text-[10px] font-mono text-accent-primary">
                  {wellLogs.NPHI[defaultIndex] !== null && wellLogs.NPHI[defaultIndex] !== undefined ? wellLogs.NPHI[defaultIndex].toFixed(2) : 'N/A'}
                </span>
              </div>

              {/* TRACK 4: Deep Resistivity (RMED) - coral */}
              <div className="flex-1 h-full border-r border-border-subtle/50 relative">
                <div className="text-[9px] font-mono text-center text-accent-danger absolute top-1 left-0 right-0 z-10 bg-void/80 py-0.5">RMED (0.1-2000 log)</div>
                <svg className="w-full h-full">
                  <polyline fill="none" stroke="#FF4D6A" strokeWidth="1.5" points={getSVGPoints(wellLogs.RMED, 0.1, 100)} />
                </svg>
                <span id="val-rmed" className="absolute bottom-2 left-2 text-[10px] font-mono text-accent-danger">
                  {wellLogs.RMED[defaultIndex] !== null && wellLogs.RMED[defaultIndex] !== undefined ? wellLogs.RMED[defaultIndex].toFixed(2) : 'N/A'}
                </span>
              </div>

              {/* TRACK 5: Acoustic Travel (DTC) - purple */}
              <div className="flex-1 h-full border-r border-border-subtle/50 relative">
                <div className="text-[9px] font-mono text-center text-purple-400 absolute top-1 left-0 right-0 z-10 bg-void/80 py-0.5">DTC (40-140)</div>
                <svg className="w-full h-full">
                  <polyline fill="none" stroke="#C084FC" strokeWidth="1.5" points={getSVGPoints(wellLogs.DTC, 40, 140)} />
                </svg>
                <span id="val-dtc" className="absolute bottom-2 left-2 text-[10px] font-mono text-purple-400">
                  {wellLogs.DTC[defaultIndex] !== null && wellLogs.DTC[defaultIndex] !== undefined ? wellLogs.DTC[defaultIndex].toFixed(2) : 'N/A'}
                </span>
              </div>

              {/* TRACK 6: Shannon Entropy (ENTROPY) - hot-pink */}
              <div className="flex-1 h-full relative">
                <div className="text-[9px] font-mono text-center text-pink-500 absolute top-1 left-0 right-0 z-10 bg-void/80 py-0.5">ENTROPY (0-3.5)</div>
                <svg className="w-full h-full">
                  <polyline fill="none" stroke="#FF007F" strokeWidth="1.5" points={getSVGPoints(wellLogs.entropies, 0, 3.5)} />
                </svg>
                <span id="val-ent" className="absolute bottom-2 left-2 text-[10px] font-mono text-pink-500">
                  {wellLogs.entropies && wellLogs.entropies[defaultIndex] !== null && wellLogs.entropies[defaultIndex] !== undefined ? wellLogs.entropies[defaultIndex].toFixed(2) : 'N/A'}
                </span>
              </div>

            </div>
          </div>
        </div>
      );
    };

    // ─── CAPABILITIES SECTION ───────────────────────────

      const executePipeline = (fileToUpload = null, silent = false, wellOverride = null, modelOverride = null, featureSetOverride = null) => {
        setUploadError(null);
        if (!silent) {
          setAnalysisLoading(true);
          setLoadingStep(0);
          setWellLogs(null);
        } else {
          setBackgroundLoading(true);
        }

        let apiPromise;
        const isUpload = !!fileToUpload;
        const activeWell = wellOverride || selectedWell;
        const activeModel = modelOverride || selectedModel;
        const activeFeatureSet = featureSetOverride || selectedFeatureSet;

        if (isUpload) {
          const formData = new FormData();
          formData.append('file', fileToUpload);
          formData.append('model_name', activeModel);
          formData.append('feature_set', activeFeatureSet);
          formData.append('use_viterbi', useViterbi ? 'true' : 'false');

          apiPromise = fetch('/api/upload', {
            method: 'POST',
            body: formData
          }).then(async (res) => {
            if (!res.ok) {
              const errData = await res.json().catch(() => ({}));
              throw new Error(errData.error || `Upload failed with status code ${res.status}`);
            }
            const uploadData = await res.json();
            
            // If background processing is running, initiate status polling
            if (res.status === 202 && uploadData.task_id) {
              return new Promise((resolve, reject) => {
                const pollInterval = setInterval(() => {
                  fetch(`/api/upload/status/${uploadData.task_id}`)
                    .then(async (statusRes) => {
                      if (!statusRes.ok) {
                        const errData = await statusRes.json().catch(() => ({}));
                        throw new Error(errData.error || `Status check failed with status code ${statusRes.status}`);
                      }
                      return statusRes.json();
                    })
                    .then((task) => {
                      if (task.status === 'completed') {
                        clearInterval(pollInterval);
                        resolve(task.result);
                      } else if (task.status === 'failed') {
                        clearInterval(pollInterval);
                        reject(new Error(task.error || 'Ingestion pipeline failed on backend.'));
                      } else {
                        // Task is still running. Update React UI progress states dynamically!
                        if (typeof task.progress_step === 'number') {
                          setLoadingStep(task.progress_step);
                        }
                        // Inject detailed backend progress logs
                        if (task.message) {
                          const progressLabel = document.getElementById('progress-message-label');
                          if (progressLabel) {
                            progressLabel.innerText = task.message;
                          }
                        }
                      }
                    })
                    .catch((err) => {
                      clearInterval(pollInterval);
                      reject(err);
                    });
                }, 2000);
              });
            }
            return uploadData;
          });
        } else {
           // Preloaded well log curves and prediction
          const fetchPrediction = fetch('/api/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              well_id: activeWell,
              model_name: activeModel,
              feature_set: activeFeatureSet,
              use_viterbi: useViterbi
            })
          }).then(async (res) => {
            if (!res.ok) {
              const errData = await res.json().catch(() => ({}));
              throw new Error(errData.error || `Failed to predict for ${activeWell}`);
            }
            return res.json();
          });

          const isSameWell = wellLogs && activeWell === wellLogs.well_id;
          if (silent && isSameWell) {
            apiPromise = fetchPrediction.then((predData) => {
              return {
                well_id: activeWell,
                model_name: activeModel,
                feature_set: activeFeatureSet,
                well_data: wellLogs.originalData, // Reuse cached curve dataset
                predictions: predData.predictions,

              if (!res.ok) {
                const errData = await res.json().catch(() => ({}));

                low_confidence_flags: predData.low_confidence_flags,
                mismatches: predData.mismatches,
                metrics: predData.metrics,

                  <div className="col-span-12 lg:col-span-4 lg:row-span-2 bg-card border border-border-subtle p-6 rounded-3xl self-start flex flex-col gap-6">
                    <span className="font-mono text-accent-primary text-xs uppercase tracking-[0.25em] block border-b border-border-subtle pb-3">MODEL LEADERBOARD</span>

                    {(() => {
                      const modelDescriptions = {
                        'Random Forest': 'Best Penalty F1 Fit',
                        'LightGBM': 'Balanced Wavelet Feature Set',
                        'KNN': 'Distance Metrics Standardized',
                        'XGBoost': 'Gradient Boosting Classifiers',
                        'Decision Tree': 'High Overfitting Susceptibility'
                      };

                      // Helper to extract numeric accuracy for sorting
                      const getScoreAcc = (m) => {
                        const val = selectedFeatureSet === 'wavelet' ? m.acc19 : m.acc12;
                        return typeof val === 'number' ? val : 0;
                      };

                      // Sort models descending by accuracy; tie-breaker: Random Forest ranks higher
                      const sortedModels = [...benchmarkScores].sort((a, b) => {
                        const scoreA = getScoreAcc(a);
                        const scoreB = getScoreAcc(b);
                        if (Math.abs(scoreA - scoreB) > 0.0001) {
                          return scoreB - scoreA;
                        }
                        const nameA = a.name.replace(' ★', '');
                        const nameB = b.name.replace(' ★', '');
                        if (nameA === 'Random Forest') return -1;
                        if (nameB === 'Random Forest') return 1;
                        return nameA.localeCompare(nameB);
                      });

                      return sortedModels.map((m, idx) => {
                        const cleanName = m.name.replace(' ★', '');
                        const rankStr = `#${idx + 1}`;
                        const rawAcc = selectedFeatureSet === 'wavelet' ? m.acc19 : m.acc12;
                        const accStr = typeof rawAcc === 'number' ? (rawAcc * 100).toFixed(1) + '%' : 'N/A';
                        
                        // Highlights the active model with primary glow, #1 model with secondary glow, and dims rest
                        const isActive = cleanName === selectedModel;
                        let borderAndGlow = 'border-border-subtle hover:border-white/20';
                        if (isActive) {
                          borderAndGlow = 'border-accent-primary bg-accent-glow/5 shadow-[0_0_20px_rgba(56,182,255,0.15)] scale-[1.02] font-bold';
                        } else if (idx === 0) {
                          borderAndGlow = 'border-accent-secondary bg-accent-glow/10 shadow-[0_0_20px_rgba(0,255,136,0.1)]';
                        } else if (idx === 4) {
                          borderAndGlow = 'border-border-subtle text-text-muted opacity-60';
                        }

                        return (
                          <div
                            key={idx}
                            className={`p-4 rounded-xl border flex justify-between items-center transition-all duration-300 hover:scale-[1.02] cursor-pointer ${borderAndGlow}`}
                            onClick={() => setSelectedModel(cleanName)}
                          >
                            <div>
                              <span className="font-display font-extrabold text-2xl text-accent-secondary mr-2">{rankStr}</span>
                              <span className="font-heading font-bold text-sm text-white">{cleanName}</span>
                              <span className="block text-[10px] font-mono text-text-muted mt-1">{modelDescriptions[cleanName] || ''}</span>
                            </div>
                            <span className="font-mono text-sm text-accent-primary font-bold">{accStr}</span>
                          </div>
                        );
                      });
                    })()}
                  </div>

                  {/* Card 3: Stacked Global SHAP contributions charts & Interpretation */}
                  <div className="col-span-12 lg:col-span-8 bg-card border border-border-subtle p-6 rounded-3xl">
                    <span className="font-mono text-[10px] text-accent-secondary block mb-2 uppercase">EXPLAINABILITY</span>
                    <h3 className="font-heading font-bold text-xl text-white mb-6">Mean |SHAP| Mineral Log Influence segments</h3>

                    <div className="w-full h-80 relative">
                      <ResponsiveContainer width="100%" height="100%">
                        <BarChart
                          layout="vertical"
                          data={[
                            { name: 'GR (Gamma Ray)', importance: 88, shale: 50, coal: 10, dolomite: 28 },
                            { name: 'DEPTH_MD', importance: 62, shale: 20, coal: 12, dolomite: 30 },
                            { name: 'RHOB (Density)', importance: 58, shale: 12, coal: 28, dolomite: 18 },
                            { name: 'DTC (Sonic)', importance: 48, shale: 8, coal: 15, dolomite: 25 },
                            { name: 'NPHI (Neutron)', importance: 38, shale: 6, coal: 22, dolomite: 10 },
                            { name: 'RMED (Resistivity)', importance: 28, shale: 4, coal: 12, dolomite: 12 }
                          ]}
                          margin={{ top: 20, right: 30, left: 40, bottom: 5 }}
                        >
                          <XAxis type="number" stroke="#8A9BB0" tick={{ fontSize: 10 }} />
                          <YAxis type="category" dataKey="name" stroke="#8A9BB0" tick={{ fontSize: 10 }} />
                          <Tooltip cursor={false} contentStyle={{ backgroundColor: '#141a17', borderColor: '#38B6FF', borderRadius: 12 }} />
                          <Legend />
                          <Bar
                            dataKey="shale"
                            stackId="a"
                            fill="#FF6B00"
                            name="Shale Contribution"
                            radius={[4, 0, 0, 4]}
                          />
                          <Bar
                            dataKey="coal"
                            stackId="a"
                            fill="#E5A93B"
                            name="Coal Contribution"
                            radius={0}
                          />
                          <Bar
                            dataKey="dolomite"
                            stackId="a"
                            fill="#F5F5DC"
                            name="Dolomite Contribution"
                            radius={[0, 4, 4, 0]}
                          />
                        </BarChart>
                      </ResponsiveContainer>
                    </div>

                    <div className="bg-void/50 border border-border-subtle p-4 rounded-xl mt-4 text-xs text-text-secondary leading-relaxed font-mono">
                      💡 <strong>Interpretation:</strong> GR dominates predicting 9 of 12 lithofacies classes; bulk density (RHOB) and NPHI are critical in isolating Coal boundaries; DTC and RMED define Carbonates.
                    </div>
                  </div>

                </div>
              )}

            </main>
          )}

          {/* Global footer dynamically shown on all views except uploader */}
          {currentRoute !== 'upload' && (
            <footer className="bg-[#020408] py-16 px-8 border-t border-white/5 text-[13px] text-text-secondary mt-auto">
              <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-8 mb-12 text-left">
                <div className="md:col-span-2">
                  <span className="font-heading font-extrabold text-base block mb-2 text-accent-secondary">
                    <span className="text-white mr-2">◈</span>LITHOFACIES ML
                  </span>
                  <p className="font-sans max-w-sm leading-relaxed mb-4 text-[13px] text-text-muted">
                    Subsurface intelligence, surface clarity. High-performance machine learning diagnostics for modern petrophysics.
                  </p>
                  <p className="font-sans max-w-sm leading-relaxed mb-4 text-[12px] text-text-muted/65 mt-3">
                    Leveraging advanced continuous wavelet transforms and deep ensemble classifiers to deliver production-grade lithology predictions. Calibrated on thousands of shelf wells across the North Sea to automate stratigraphy workflows with unmatched physical consistency.
                  </p>
                </div>
                <div>
                  <span className="font-mono text-white block mb-4 text-xs font-bold uppercase tracking-wider">GEOSCIENCE ENGINE</span>
                  <ul className="space-y-3 font-sans text-sm text-text-secondary">
                    <li className="cursor-pointer hover:text-[#00FF88] transition-colors duration-200">
                      FORCE 2020 Subsurface Benchmark
                    </li>
                    <li className="cursor-pointer hover:text-[#00FF88] transition-colors duration-200">
                      Norway Shelf Database Core Reference
                    </li>
                    <li className="cursor-pointer hover:text-[#00FF88] transition-colors duration-200">
                      Kazakhastan well-logs dataset
                    </li>
                  </ul>
                </div>
                <div>
                  <span className="font-mono text-white block mb-4 text-xs font-bold uppercase tracking-wider">LIBRARIES</span>
                  <ul className="space-y-3 font-sans text-sm text-text-secondary">
                    <li className="cursor-pointer hover:text-[#00FF88] transition-colors duration-200">
                      scikit-learn & PyWavelets
                    </li>
                    <li className="cursor-pointer hover:text-[#00FF88] transition-colors duration-200">
                      SHAP Kernel Explainer
                    </li>
                    <li className="cursor-pointer hover:text-[#00FF88] transition-colors duration-200">
                      Ensemble Learning
                    </li>
                    <li className="mt-4 pt-3 border-t border-white/10">
                      <a
                        href="https://github.com/Dhruv-Jain-2006/lithofacies-ml"
                        target="_blank"
                        rel="noopener noreferrer"
                        className="inline-flex items-center gap-2.5 text-base font-extrabold text-white hover:text-[#00FF88] tracking-wide transition-colors duration-200 cursor-pointer"
                      >
                        <i className="fa-brands fa-github text-lg"></i>GitHub
                      </a>
                    </li>
                  </ul>
                </div>
              </div>
              <div className="max-w-7xl mx-auto pt-8 border-t border-white/5 flex flex-col md:flex-row justify-between items-center gap-4 text-center md:text-left font-mono text-xs">
                <span className="text-center md:text-left">© 2026 Lithofacies ML. All rights reserved.</span>
                <span className="text-center md:text-right">Norwegian Petroleum Directorate Calibration Standard</span>
              </div>
            </footer>
          )}

        </div>
      );
    }

    // Mount to root DOM node
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
