{% raw %}
<!DOCTYPE html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LithoFacies ML — Subsurface Geologic Intelligence</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap"
    rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            void: '#090e0c',
            surface: '#141a17',
            elevated: '#1c2420',
            card: '#16211c',
            accent: {
              primary: '#38B6FF',
              secondary: '#00FF88',
              warn: '#A66E4E',
              danger: '#FF4D6A',
            }
          },
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
            heading: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- React & ReactDOM (Production) -->
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js" crossorigin></script>

  <!-- Babel Standalone (JSX compiler in browser) -->
  <script src="https://unpkg.com/@babel/standalone@7.24.0/babel.min.js"></script>

  <!-- HLS.js for live seismic video stream -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>

  <!-- Recharts & dependencies -->
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>

  <style>
    /* Custom Styling Overrides & Global Effects */
    body {
      background-color: #090e0c;
      overflow-x: hidden;
      color: #F0F4F8;
    }

    /* Scanline Overlay effect */
    .scanline-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%,
          rgba(0, 0, 0, 0.25) 50%);
      background-size: 100% 4px;
      opacity: 0.025;
      pointer-events: none;
      z-index: 9999;
    }

    /* Grain/Noise Overlay */
    .grain-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      opacity: 0.04;
      pointer-events: none;
      z-index: 9998;
    }

    /* Floating Capsule Navbar */
    .capsule-navbar {
      background: rgba(14, 22, 18, 0.45);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    /* Custom premium scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #090e0c;
    }

    ::-webkit-scrollbar-thumb {
      background: #1c2420;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #38B6FF;
    }

    /* Text Gradient */
    .text-gradient-rock {
      background: linear-gradient(135deg, #38B6FF 0%, #00FF88 50%, #A66E4E 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Dynamic fade-up page entrance */
    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .animate-fade-up {
      animation: fadeUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>

<body class="h-full font-sans antialiased">
  <!-- Interactive Cinematic Overlays -->
  <div class="scanline-overlay"></div>
  <div class="grain-overlay"></div>

  <!-- React Mount Point -->
  <div id="root" class="h-full"></div>

  <!-- React Logic & Core SPA App Engine -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;
    const {
      ResponsiveContainer, AreaChart, Area, BarChart, Bar,
      XAxis, YAxis, Tooltip, Legend, RadarChart, PolarGrid,
      PolarAngleAxis, PolarRadiusAxis, Radar, CartesianGrid
    } = Recharts;

    // Fixed color code mapping for 12 lithologies (organic tones)
    const FACIES_COLOR_MAP = {
      'Sandstone': '#F5A623',
      'Shale': '#555566',
      'Limestone': '#38B6FF',
      'Chalk': '#E8EDF2',
      'Halite': '#FF4D6A',
      'Dolomite': '#00E5CC',
      'Coal': '#111116',
      'Marl': '#8B6914',
      'Anhydrite': '#C084FC',
      'Tuff': '#86EFAC',
      'Basement': '#374151',
      'Sandstone/Shale': '#D97706'
    };

    // Hardcoded Norway Benchmark Scores table replicated from Table 6
    const BENCHMARK_SCORES = [
      { name: 'KNN', acc12: 0.926, pen12: -0.1796, ham12: 0.0672, acc19: 0.801, pen19: -0.5237, ham19: 0.1969 },
      { name: 'Random Forest ★', acc12: 0.948, pen12: -0.1289, ham12: 0.0473, acc19: 0.938, pen19: -0.1697, ham19: 0.0624, isWinner: true },
      { name: 'Decision Tree', acc12: 0.820, pen12: -0.4810, ham12: 0.1832, acc19: 0.817, pen19: -0.4810, ham19: 0.1826 },
      { name: 'XGBoost', acc12: 0.855, pen12: -0.3812, ham12: 0.1418, acc19: 0.862, pen19: -0.3681, ham19: 0.1631 },
      { name: 'LightGBM', acc12: 0.897, pen12: -0.2600, ham12: 0.0984, acc19: 0.901, pen19: -0.2599, ham19: 0.1378 }
    ];

    const normalizeDatasetName = (name) => {
      if (!name) return '';
      return name.replace(/[\u2014\u2013-]/g, '-').replace(/\s+/g, ' ').trim().toLowerCase();
    };

    // Preloaded Datasets selection configurations
    const PRELOADED_DATASETS = [
      { id: '01', name: 'Norway — FORCE 2020 Full', details: '98 wells, 12 lithofacies classes, 234,103 samples', wellCode: 'WELL_FORCE_2020_01' },
      { id: '02', name: 'Norway — North Sea Subset', details: '20 wells, balanced class sampling, 48,000 samples', wellCode: 'WELL_FORCE_2020_02' },
      { id: '03', name: 'Kazakhstan Field', details: '10 wells, 5 lithofacies, 59,423 samples', wellCode: 'WELL_FORCE_2020_03' },
      { id: '04', name: 'Norway — Single Well Demo', details: '1 well, instant results, best for exploration', wellCode: 'WELL_FORCE_2020_04' }
    ];

    const LITHOLOGY_LABELS = [
      'Sandstone', 'Sandstone/Shale', 'Shale', 'Marl', 'Dolomite', 'Limestone',
      'Chalk', 'Halite', 'Anhydrite', 'Tuff', 'Coal', 'Basement'
    ];

    // Landing screen HLS stream video rendering
    const VideoStream = () => {
      const videoRef = useRef(null);

      useEffect(() => {
        if (!videoRef.current) return;
        const video = videoRef.current;
        const streamUrl = 'https://stream.mux.com/01yW6GoUz01OTXk5w1Rt1MHkJWlCGIwj46SUONJZ4DJUE.m3u8';

        if (typeof Hls !== 'undefined' && Hls.isSupported && Hls.isSupported()) {
          const hls = new Hls();
          hls.loadSource(streamUrl);
          hls.attachMedia(video);
          hls.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(e => console.log('HLS Play Blocked:', e));
          });
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
          video.src = streamUrl;
          video.addEventListener('loadedmetadata', () => {
            video.play().catch(e => console.log('Native Play Blocked:', e));
          });
        } else {
          // Fallback poster/background if streaming is entirely unsupported/blocked
          video.poster = "https://images.unsplash.com/photo-1444703686981-a3abbc4d4fe3?auto=format&fit=crop&w=1200&q=80";
        }
      }, []);

      return (
        <video
          ref={videoRef}
          className="absolute top-0 left-0 w-full h-full object-cover pointer-events-none"
          autoPlay
          muted
          loop
          playsInline
        />
      );
    };

    // Continuous Wavelet scalogram Canvas Renderer
    const WaveletScalogramCanvas = ({ wellLogs, waveletLogSelect }) => {
      const canvasRef = useRef(null);

      useEffect(() => {
        if (!canvasRef.current || !wellLogs) return;
        const canvas = canvasRef.current;
        const ctx = canvas.getContext('2d');
        const width = canvas.width;
        const height = canvas.height;

        // Clear previous canvas
        ctx.clearRect(0, 0, width, height);

        // Draw continuous wavelet ridges (Mexican hat coefficients matrix simulation)
        const traceLog = wellLogs[waveletLogSelect] || wellLogs.GR;
        const len = traceLog.length;

        for (let y = 0; y < height; y++) {
          // Frequencies scaling along y-axis
          const frequencyScale = 1 + (y / height) * 32;

          for (let x = 0; x < width; x++) {
            const dataIdx = Math.floor((x / width) * len);
            const val = traceLog[dataIdx];

            // Apply Ricker continuous wavelet formula coefficients simulation
            const rawCoef = Math.sin(dataIdx * 0.05 * frequencyScale) * Math.cos(val * 0.02) * Math.exp(-0.002 * Math.pow(x - width / 2, 2) / frequencyScale);

            // Map coefficients to a color scale: blue (negative) -> black (zero) -> red (positive)
            let r = 0, g = 0, b = 0;
            if (rawCoef > 0) {
              r = Math.floor(Math.min(255, rawCoef * 350));
            } else {
              b = Math.floor(Math.min(255, Math.abs(rawCoef) * 350));
            }

            ctx.fillStyle = `rgb(${r}, ${g}, ${b})`;
            ctx.fillRect(x, y, 1, 1);
          }
        }
      }, [wellLogs, waveletLogSelect]);

      return (
        <div className="relative w-full overflow-hidden bg-void rounded-lg border border-border-subtle p-2">
          <canvas ref={canvasRef} className="w-full h-72 block rounded" width="600" height="200"></canvas>
          <div className="flex justify-between text-[10px] font-mono text-accent-primary mt-2">
            <span>Low Frequency Bounds</span>
            <span>High Frequency Ridge Scan</span>
          </div>
        </div>
      );
    };

    // Interactive Well Attribute Observatory
    const MissingDataMap = ({ availableWells, selectedWell, setSelectedWell, wellLogs }) => {
      // Define attribute details: name, description, unit, range, and standard average readings
      const attributeDetails = {
        'GR': { fullName: 'Gamma Ray Log', desc: 'Senses natural radioactivity of formations to identify shale/clay layers.', unit: 'gAPI', range: '0 - 150', mean: 75.4, status: 'Optimal' },
        'RHOB': { fullName: 'Bulk Density Log', desc: 'Measures bulk density of formations to calculate porosity and rock matrix.', unit: 'g/cc', range: '1.5 - 3.0', mean: 2.34, status: 'Optimal' },
        'NPHI': { fullName: 'Neutron Porosity', desc: 'Indicates the hydrogen index, key for liquid-filled pore volume identification.', unit: 'v/v', range: '-0.15 - 0.45', mean: 0.22, status: 'Optimal' },
        'DTC': { fullName: 'Sonic Travel Time', desc: 'Compressional wave travel time used for rock strength and seismic ties.', unit: 'µs/ft', range: '40 - 140', mean: 82.1, status: 'Optimal' },
        'RMED': { fullName: 'Medium Resistivity', desc: 'Medium depth of investigation resistivity log tracking fluid content.', unit: 'ohm.m', range: '0.2 - 2000', mean: 15.6, status: 'Optimal' },
        'RDEP': { fullName: 'Deep Resistivity', desc: 'Deepest investigation resistivity log key for water/oil saturation.', unit: 'ohm.m', range: '0.2 - 2000', mean: 18.2, status: 'Optimal' },
        'RSHA': { fullName: 'Shallow Resistivity', desc: 'Shallow sensor tracking mud filtrate invasion near borehole wall.', unit: 'ohm.m', range: '0.2 - 2000', mean: 12.4, status: 'Optimal' },
        'CALI': { fullName: 'Caliper Log', desc: 'Measures borehole diameter, tracking borehole rugosity or washouts.', unit: 'inches', range: '6.0 - 20.0', mean: 8.5, status: 'Optimal' },
        'PEF': { fullName: 'Photoelectric Factor', desc: 'Determines the mineral composition (lithology matrix index).', unit: 'b/e', range: '1.0 - 10.0', mean: 3.2, status: 'Optimal' },
        'SP': { fullName: 'Spontaneous Potential', desc: 'Tracks natural electrical currents to separate permeable and impermeable beds.', unit: 'mV', range: '-120 - 40', mean: -45.0, status: 'Optimal' },
        'BS': { fullName: 'Bit Size Log', desc: 'Nominal diameter of the drill bit used to create the borehole.', unit: 'inches', range: '8.5 - 12.25', mean: 8.5, status: 'Optimal' },
        'DEPTH_MD': { fullName: 'Measured Depth', desc: 'Physical borehole track distance measured along wellbore path.', unit: 'm', range: '1200 - 4500', mean: 2850, status: 'Optimal' }
      };

      // Determine real mean values from current wellLogs, otherwise use base
      const getWellValue = (attrKey) => {
        const base = attributeDetails[attrKey];
        if (!base) return null;

        let meanVal = base.mean;
        let status = 'Optimal';

        if (wellLogs && wellLogs.well_data) {
          const arr = wellLogs.well_data[attrKey];
          if (Array.isArray(arr) && arr.length > 0) {
            const validVals = arr.filter(v => v !== null && v !== undefined && !isNaN(v));
            if (validVals.length > 0) {
              const sum = validVals.reduce((acc, curr) => acc + curr, 0);
              meanVal = sum / validVals.length;
              
              // If there are many nulls, we can call it Imputed
              const missingCount = arr.length - validVals.length;
              if (missingCount > 0) {
                status = 'Imputed';
              }
            } else {
              meanVal = 0.0;
              status = 'Missing';
            }
          } else {
            meanVal = 0.0;
            status = 'Missing';
          }
        } else {
          // Simulated variation if wellLogs is not loaded yet based on selectedWell
          if (selectedWell === 'WELL_FORCE_2020_02' && (attrKey === 'RHOB' || attrKey === 'RMED')) {
            status = 'Imputed';
            meanVal = base.mean * 0.95;
          } else if (selectedWell === 'WELL_FORCE_2020_03' && (attrKey === 'SP' || attrKey === 'BS')) {
            status = 'Missing';
            meanVal = 0.0;
          } else if (selectedWell === 'WELL_FORCE_2020_04' && (attrKey === 'CALI' || attrKey === 'PEF')) {
            status = 'Imputed';
            meanVal = base.mean * 0.88;
          } else if (selectedWell === 'uploaded_well' && (attrKey === 'SP' || attrKey === 'BS')) {
            status = 'Missing';
            meanVal = 0.0;
          }
        }

        return {
          ...base,
          mean: meanVal,
          status
        };
      };

      // If availableWells is empty, fallback to a standard list of preloaded wells
      const wellsToRender = availableWells.length > 0 ? 
        availableWells.map(w => w.well_id) : 
        ['WELL_FORCE_2020_01', 'WELL_FORCE_2020_02', 'WELL_FORCE_2020_03', 'WELL_FORCE_2020_04'];

      return (
        <div className="flex flex-col gap-6 bg-void/50 p-6 rounded-2xl border border-border-subtle">

          {/* Well Selector Horizontal Scroll Bar */}
          <div className="flex gap-2.5 overflow-x-auto pb-2 scrollbar-none">
            {wellsToRender.map(w => (
              <button
                key={w}
                onClick={() => setSelectedWell(w)}
                className={`px-5 py-2.5 rounded-xl font-heading font-bold text-xs uppercase tracking-wider transition-all duration-300 flex-shrink-0 ${selectedWell === w ? 'bg-accent-secondary text-void shadow-[0_0_15px_rgba(0,255,136,0.15)] scale-[1.02]' : 'bg-card border border-border-subtle text-text-secondary hover:text-white hover:border-text-muted'}`}
              >
                <i className="fa-solid fa-bore-hole mr-2"></i>{w}
              </button>
            ))}
          </div>

          {/* Ingested Attributes Dashboard Table Grid */}
          <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            {Object.keys(attributeDetails).map(attrKey => {
              const attr = getWellValue(attrKey);

              // Color mapping for statuses
              const statusColors = {
                'Optimal': { text: 'text-accent-secondary', bg: 'bg-accent-secondary/10', dot: 'bg-accent-secondary' },
                'Imputed': { text: 'text-accent-warn', bg: 'bg-accent-warn/10', dot: 'bg-accent-warn' },
                'Missing': { text: 'text-accent-danger', bg: 'bg-accent-danger/10', dot: 'bg-accent-danger' }
              }[attr.status];

              return (
                <div key={attrKey} className="bg-card border border-border-subtle p-4 rounded-xl flex flex-col justify-between transition-all duration-300 hover:border-accent-primary/20 hover:shadow-[0_5px_15px_rgba(56,182,255,0.02)]">

                  <div className="flex justify-between items-start gap-4 mb-2">
                    <div>
                      <span className="font-mono text-accent-primary font-bold text-base">{attrKey}</span>
                      <h4 className="font-heading font-bold text-[13px] text-white leading-tight mt-0.5">{attr.fullName}</h4>
                    </div>

                    <span className={`px-2.5 py-0.5 rounded-full font-mono text-[9px] uppercase tracking-wider flex items-center gap-1.5 ${statusColors.text} ${statusColors.bg}`}>
                      <span className={`w-1.5 h-1.5 rounded-full ${statusColors.dot} animate-pulse`}></span>
                      {attr.status}
                    </span>
                  </div>

                  <p className="font-sans text-[11px] text-text-muted leading-relaxed mb-4 flex-grow">
                    {attr.desc}
                  </p>

                  <div className="border-t border-border-subtle pt-3 flex justify-between items-center text-[10px] font-mono text-text-secondary">
                    <div>
                      <span className="block text-[8px] text-text-muted uppercase">Recorded Value</span>
                      <strong className="text-white text-sm font-extrabold">
                        {attr.status === 'Missing' ? 'N/A' : `${attr.mean.toFixed(2)} ${attr.unit}`}
                      </strong>
                    </div>

                    <div className="text-right">
                      <span className="block text-[8px] text-text-muted uppercase">Optimal Range</span>
                      <span>{attr.range} {attr.unit}</span>
                    </div>
                  </div>

                </div>
              );
            })}
          </div>

        </div>
      );
    };

    // Custom 5-Track SVG Well Log track visualizer
    const WellTrackVisualizer = ({ wellLogs }) => {
      if (!wellLogs) return null;

      const defaultIndex = Math.min(150, wellLogs.depth.length - 1);
      const initialDepth = wellLogs.depth[defaultIndex] || 0;
      const initialPred = wellLogs.predictions[defaultIndex] || 'Shale';
      const initialProb = wellLogs.probabilities[defaultIndex] || 1.0;

      // Sync local depth indexing coordinate dynamically via high-performance direct DOM updates
      const handleTrackMouseMove = (e) => {
        const rect = e.currentTarget.getBoundingClientRect();
        const relativeY = e.clientY - rect.top;
        const totalHeight = rect.height;
        const idx = Math.max(0, Math.min(wellLogs.depth.length - 1, Math.floor((relativeY / totalHeight) * wellLogs.depth.length)));

        const activeDepth = wellLogs.depth[idx];
        const activePred = wellLogs.predictions[idx];
        const activeProb = wellLogs.probabilities[idx];

        // Elements to update
        const elDepth = document.getElementById('hud-depth');
        const elPred = document.getElementById('hud-pred');
        const elProb = document.getElementById('hud-prob');
        const elFaciesPointer = document.getElementById('facies-pointer');
        const elCursorLine = document.getElementById('cursor-line');
        const elCursorDepthLabel = document.getElementById('cursor-depth-label');

        const elValGr = document.getElementById('val-gr');
        const elValRhob = document.getElementById('val-rhob');
        const elValNphi = document.getElementById('val-nphi');
        const elValRmed = document.getElementById('val-rmed');
        const elValDtc = document.getElementById('val-dtc');

        // Mutate values instantly
        if (elDepth) elDepth.textContent = activeDepth.toFixed(1) + ' m';
        if (elPred) {
          elPred.textContent = activePred;
          elPred.style.color = FACIES_COLOR_MAP[activePred] || '#ffffff';
        }
        if (elProb) elProb.textContent = 'Confidence: ' + (activeProb * 100).toFixed(1) + '%';
        if (elFaciesPointer) elFaciesPointer.style.top = `${(idx / wellLogs.predictions.length) * 100}%`;
        if (elCursorLine) {
          elCursorLine.style.top = `${(relativeY / totalHeight) * 480}px`;
          elCursorLine.style.display = 'block';
        }
        if (elCursorDepthLabel) elCursorDepthLabel.textContent = 'Cursor Track Depth: ' + activeDepth.toFixed(1) + ' m';

        if (elValGr && wellLogs.GR) elValGr.textContent = wellLogs.GR[idx] !== null && wellLogs.GR[idx] !== undefined ? wellLogs.GR[idx].toFixed(2) : 'N/A';
        if (elValRhob && wellLogs.RHOB) elValRhob.textContent = wellLogs.RHOB[idx] !== null && wellLogs.RHOB[idx] !== undefined ? wellLogs.RHOB[idx].toFixed(2) : 'N/A';
        if (elValNphi && wellLogs.NPHI) elValNphi.textContent = wellLogs.NPHI[idx] !== null && wellLogs.NPHI[idx] !== undefined ? wellLogs.NPHI[idx].toFixed(2) : 'N/A';
        if (elValRmed && wellLogs.RMED) elValRmed.textContent = wellLogs.RMED[idx] !== null && wellLogs.RMED[idx] !== undefined ? wellLogs.RMED[idx].toFixed(2) : 'N/A';
        if (elValDtc && wellLogs.DTC) elValDtc.textContent = wellLogs.DTC[idx] !== null && wellLogs.DTC[idx] !== undefined ? wellLogs.DTC[idx].toFixed(2) : 'N/A';
      };

      // Draw individual curve traces
      const getSVGPoints = (curveData, minVal, maxVal, width = 160, height = 480) => {
        return curveData.map((val, idx) => {
          const x = ((val - minVal) / (maxVal - minVal)) * width;
          const y = (idx / curveData.length) * height;
          return `${x},${y}`;
        }).join(' ');
      };

      return (
        <div className="w-full overflow-x-auto scrollbar-thin">
          <div className="grid grid-cols-12 gap-4 bg-void p-6 rounded-2xl border border-border-subtle relative min-w-[680px] md:min-w-0">

            {/* Hover floating coordinate dashboard HUD */}
            <div className="col-span-12 flex justify-between items-center bg-elevated/80 border border-border-accent/20 px-4 py-2.5 rounded-xl backdrop-blur-md">
              <div className="flex gap-4">
                <span className="text-xs font-mono text-text-secondary">ACTIVE DEPTH: <strong id="hud-depth" className="text-accent-primary text-sm">{initialDepth.toFixed(1)} m</strong></span>
                <span className="text-xs font-mono text-text-secondary">FACIES CLASSIFICATION: <strong id="hud-pred" className="text-accent-secondary text-sm" style={{ color: FACIES_COLOR_MAP[initialPred] }}>{initialPred}</strong></span>
              </div>
              <span id="hud-prob" className="text-xs font-mono text-accent-primary bg-accent-glow px-2.5 py-1 rounded">Confidence: {(initialProb * 100).toFixed(1)}%</span>
            </div>

            {/* Side column: Interactive Lithofacies scrollbar strip */}
            <div className="col-span-2 flex flex-col items-center">
              <div className="text-[10px] font-mono text-accent-primary uppercase mb-2">Facies Column</div>
              <div className="w-16 h-[480px] relative rounded-lg border border-border-subtle overflow-hidden">
                {wellLogs.predictions.map((p, idx) => {
                  if (idx % 2 !== 0) return null; // Resample slightly for lighter DOM footprint
                  return (
                    <div
                      key={idx}
                      className="absolute left-0 w-full"
                      style={{
                        top: `${(idx / wellLogs.predictions.length) * 100}%`,
                        height: `${(2 / wellLogs.predictions.length) * 100}%`,
                        backgroundColor: FACIES_COLOR_MAP[p]
                      }}
                    ></div>
                  );
                })}
                {/* Horizontal pointer mapping location */}
                <div
                  id="facies-pointer"
                  className="absolute left-0 w-full h-[2px] bg-white shadow-[0_0_12px_#fff] z-10"
                  style={{ top: `${(defaultIndex / wellLogs.predictions.length) * 100}%` }}
                ></div>
              </div>
            </div>

            {/* Five Parallel SVG Mineral Curve Tracks */}
            <div className="col-span-10 flex gap-2 h-[480px] bg-void/50 border border-border-subtle rounded-xl p-2 relative cursor-ns-resize overflow-hidden" onMouseMove={handleTrackMouseMove}>

              {/* Dynamic Y Axis overlay alignment line */}
              <div
                id="cursor-line"
                className="absolute left-0 w-full h-[2px] bg-accent-primary/40 border-t border-accent-primary/70 z-20 pointer-events-none"
                style={{ top: `${(defaultIndex / wellLogs.depth.length) * 480}px` }}
              >
                <div id="cursor-depth-label" className="absolute right-2 -top-5 text-[9px] font-mono bg-void/90 border border-accent-primary/20 px-1 rounded text-accent-primary">
                  Cursor Track Depth: {initialDepth.toFixed(1)} m
                </div>
              </div>

              {/* TRACK 1: Gamma Ray (GR) - amber */}
              <div className="flex-1 h-full border-r border-border-subtle/50 relative">
                <div className="text-[9px] font-mono text-center text-accent-warn absolute top-1 left-0 right-0 z-10 bg-void/80 py-0.5">GR (0-150 gAPI)</div>
                <svg className="w-full h-full">
                  <polyline fill="none" stroke="#F5A623" strokeWidth="1.5" points={getSVGPoints(wellLogs.GR, 0, 150)} />
                </svg>
                <span id="val-gr" className="absolute bottom-2 left-2 text-[10px] font-mono text-accent-warn">
                  {wellLogs.GR[defaultIndex] !== null && wellLogs.GR[defaultIndex] !== undefined ? wellLogs.GR[defaultIndex].toFixed(2) : 'N/A'}
                </span>
              </div>

              {/* TRACK 2: Bulk Density (RHOB) - teal */}
              <div className="flex-1 h-full border-r border-border-subtle/50 relative">
                <div className="text-[9px] font-mono text-center text-accent-secondary absolute top-1 left-0 right-0 z-10 bg-void/80 py-0.5">RHOB (1.5-3.0)</div>
                <svg className="w-full h-full">
                  <polyline fill="none" stroke="#00FF88" strokeWidth="1.5" points={getSVGPoints(wellLogs.RHOB, 1.5, 3.0)} />
                </svg>
                <span id="val-rhob" className="absolute bottom-2 left-2 text-[10px] font-mono text-accent-secondary">
                  {wellLogs.RHOB[defaultIndex] !== null && wellLogs.RHOB[defaultIndex] !== undefined ? wellLogs.RHOB[defaultIndex].toFixed(2) : 'N/A'}
                </span>
              </div>

              {/* TRACK 3: Neutron Porosity (NPHI) - blue */}
              <div className="flex-1 h-full border-r border-border-subtle/50 relative">
                <div className="text-[9px] font-mono text-center text-accent-primary absolute top-1 left-0 right-0 z-10 bg-void/80 py-0.5">NPHI (0.45--0.15)</div>
                <svg className="w-full h-full">
                  <polyline fill="none" stroke="#38B6FF" strokeWidth="1.5" points={getSVGPoints(wellLogs.NPHI, 0.45, -0.15)} />
                </svg>
                <span id="val-nphi" className="absolute bottom-2 left-2 text-[10px] font-mono text-accent-primary">
                  {wellLogs.NPHI[defaultIndex] !== null && wellLogs.NPHI[defaultIndex] !== undefined ? wellLogs.NPHI[defaultIndex].toFixed(2) : 'N/A'}
                </span>
              </div>

              {/* TRACK 4: Deep Resistivity (RMED) - coral */}
              <div className="flex-1 h-full border-r border-border-subtle/50 relative">
                <div className="text-[9px] font-mono text-center text-accent-danger absolute top-1 left-0 right-0 z-10 bg-void/80 py-0.5">RMED (0.1-2000 log)</div>
                <svg className="w-full h-full">
                  <polyline fill="none" stroke="#FF4D6A" strokeWidth="1.5" points={getSVGPoints(wellLogs.RMED, 0.1, 100)} />
                </svg>
                <span id="val-rmed" className="absolute bottom-2 left-2 text-[10px] font-mono text-accent-danger">
                  {wellLogs.RMED[defaultIndex] !== null && wellLogs.RMED[defaultIndex] !== undefined ? wellLogs.RMED[defaultIndex].toFixed(2) : 'N/A'}
                </span>
              </div>

              {/* TRACK 5: Acoustic Travel (DTC) - purple */}
              <div className="flex-1 h-full relative">
                <div className="text-[9px] font-mono text-center text-purple-400 absolute top-1 left-0 right-0 z-10 bg-void/80 py-0.5">DTC (40-140)</div>
                <svg className="w-full h-full">
                  <polyline fill="none" stroke="#C084FC" strokeWidth="1.5" points={getSVGPoints(wellLogs.DTC, 40, 140)} />
                </svg>
                <span id="val-dtc" className="absolute bottom-2 left-2 text-[10px] font-mono text-purple-400">
                  {wellLogs.DTC[defaultIndex] !== null && wellLogs.DTC[defaultIndex] !== undefined ? wellLogs.DTC[defaultIndex].toFixed(2) : 'N/A'}
                </span>
              </div>

            </div>
          </div>
        </div>
      );
    };

    // Global App Component
    // Global App Component
    function App() {
      const [isInitializing, setIsInitializing] = useState(true);

      // Navigation states: 'landing', 'upload', 'results'
      const [currentRoute, setCurrentRoute] = useState(() => {
        const saved = localStorage.getItem('lithofacies_route');
        return (saved && saved !== 'undefined') ? saved : 'landing';
      });
      const [activeTab, setActiveTab] = useState(() => {
        const saved = localStorage.getItem('lithofacies_tab');
        return (saved && saved !== 'undefined') ? saved : 'prediction';
      });

      // Selected database references
      const [selectedWell, setSelectedWell] = useState(() => {
        const saved = localStorage.getItem('lithofacies_well');
        return (saved && saved !== 'undefined' && saved !== 'WELL_CUSTOM' && saved !== 'uploaded_well') ? saved : 'WELL_FORCE_2020_01';
      });
      const [selectedDatasetName, setSelectedDatasetName] = useState(() => {
        const saved = localStorage.getItem('lithofacies_dataset');
        return (saved && saved !== 'undefined') ? saved : 'Norway — FORCE 2020 Full';
      });
      const [uploadedFile, setUploadedFile] = useState(null);
      const [uploadError, setUploadError] = useState(null);
      const [analysisLoading, setAnalysisLoading] = useState(false);
      const [loadingStep, setLoadingStep] = useState(0);

      // Backend status and metadata caches
      const [backendStatus, setBackendStatus] = useState(null);
      const [availableWells, setAvailableWells] = useState([]);

      // Click persistent tooltips for charts
      const [clickedClassSupport, setClickedClassSupport] = useState(null);
      const [clickedSHAP, setClickedSHAP] = useState(null);
      const [classSupportCoords, setClassSupportCoords] = useState({ x: 0, y: 0 });
      const [shapCoords, setShapCoords] = useState({ x: 0, y: 0 });

      // File upload hidden inputs refs
      const fileInputRef = useRef(null);

      // Save state variables to localStorage when they change
      useEffect(() => {
        localStorage.setItem('lithofacies_route', currentRoute);
      }, [currentRoute]);

      useEffect(() => {
        localStorage.setItem('lithofacies_tab', activeTab);
      }, [activeTab]);

      useEffect(() => {
        localStorage.setItem('lithofacies_well', selectedWell);
      }, [selectedWell]);

      useEffect(() => {
        localStorage.setItem('lithofacies_dataset', selectedDatasetName);
      }, [selectedDatasetName]);

      // Fetch backend metadata and available wells list on mount
      useEffect(() => {
        fetch('/api/status')
          .then(res => res.json())
          .then(statusData => {
            setBackendStatus(statusData);
            if (statusData.dataset_info) {
              setPredictionStats(prev => ({
                ...prev,
                samplesCount: statusData.dataset_info.total_rows,
                wellsCount: statusData.dataset_info.num_wells
              }));
            }
          })
          .catch(err => console.error("Error loading status:", err));

        fetch('/api/wells')
          .then(res => res.json())
          .then(wellsData => {
            setAvailableWells(wellsData);
            if (wellsData.length > 0) {
              const hasSaved = wellsData.some(w => w.well_id === selectedWell);
              if (!hasSaved) {
                const hasDefault = wellsData.some(w => w.well_id === 'WELL_FORCE_2020_01');
                if (hasDefault) {
                  setSelectedWell('WELL_FORCE_2020_01');
                } else {
                  setSelectedWell(wellsData[0].well_id);
                }
              }
            }
          })
          .catch(err => console.error("Error loading wells:", err));
      }, []);

      const triggerFileSelect = () => {
        if (fileInputRef.current) {
          fileInputRef.current.click();
        }
      };

      // Predictions & well logs cached state
      const [wellLogs, setWellLogs] = useState(null);
      const [benchmarkScores, setBenchmarkScores] = useState(BENCHMARK_SCORES);
      const [depthCursorIndex, setDepthCursorIndex] = useState(150);
      const [selectedModel, setSelectedModel] = useState(() => {
        const saved = localStorage.getItem('lithofacies_model');
        return (saved && saved !== 'undefined') ? saved : 'Random Forest';
      });
      const [selectedFeatureSet, setSelectedFeatureSet] = useState(() => {
        const saved = localStorage.getItem('lithofacies_feature_set');
        return (saved && saved !== 'undefined') ? saved : 'wavelet';
      });

      useEffect(() => {
        localStorage.setItem('lithofacies_model', selectedModel);
      }, [selectedModel]);

      useEffect(() => {
        localStorage.setItem('lithofacies_feature_set', selectedFeatureSet);
      }, [selectedFeatureSet]);

      const [predictionStats, setPredictionStats] = useState({
        dominantClass: 'Shale',
        dominantPercent: '62.9%',
        samplesCount: 234103,
        wellsCount: 98,
        accuracy: 0.948
      });

      // Wavelet scalogram track toggle log
      const [waveletLogSelect, setWaveletLogSelect] = useState('GR');

      // Pipeline execution orchestrator
      const executePipeline = (fileToUpload = null, silent = false, wellOverride = null) => {
        setUploadError(null);
        if (!silent) {
          setAnalysisLoading(true);
          setLoadingStep(0);
        }

        let apiPromise;
        const isUpload = !!fileToUpload;
        const activeWell = wellOverride || selectedWell;
        const activeModel = selectedModel;
        const activeFeatureSet = selectedFeatureSet;

        if (isUpload) {
          const formData = new FormData();
          formData.append('file', fileToUpload);
          formData.append('model_name', activeModel);
          formData.append('feature_set', activeFeatureSet);

          apiPromise = fetch('/api/upload', {
            method: 'POST',
            body: formData
          }).then(async (res) => {
            if (!res.ok) {
              const errData = await res.json().catch(() => ({}));
              throw new Error(errData.error || `Upload failed with status code ${res.status}`);
            }
            return res.json();
          });
        } else {
           // Preloaded well log curves and prediction
          const fetchWellData = fetch(`/api/well/${activeWell}`).then(async (res) => {
            if (!res.ok) {
              const errData = await res.json().catch(() => ({}));
              throw new Error(errData.error || `Failed to fetch well curves for ${activeWell}`);
            }
            return res.json();
          });

          const fetchPrediction = fetch('/api/predict', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              well_id: activeWell,
              model_name: activeModel,
              feature_set: activeFeatureSet
            })
          }).then(async (res) => {
            if (!res.ok) {
              const errData = await res.json().catch(() => ({}));
              throw new Error(errData.error || `Failed to predict for ${activeWell}`);
            }
            return res.json();
          });

          const fetchCompare = fetch(`/api/well/${activeWell}/compare`).then(async (res) => {
            if (!res.ok) return [];
            return res.json();
          }).catch(() => []);

          apiPromise = Promise.all([fetchWellData, fetchPrediction, fetchCompare]).then(([wellData, predData, compareData]) => {
            return {
              well_id: activeWell,
              model_name: activeModel,
              feature_set: activeFeatureSet,
              well_data: wellData,
              predictions: predData.predictions,
              probabilities: predData.probabilities,
              mismatches: predData.mismatches,
              metrics: predData.metrics,
              comparison_metrics: compareData
            };
          });
        }

        // Run the step progression animation concurrently
        let interval = null;
        if (!silent) {
          interval = setInterval(() => {
            setLoadingStep(prev => {
              if (prev < 4) {
                return prev + 1;
              }
              return prev;
            });
          }, 500);
        }

        return apiPromise
          .then((data) => {
            if (interval) clearInterval(interval);
            
            // Map prediction integers to facies label strings
            const mappedPredictions = data.predictions.map(idx => LITHOLOGY_LABELS[idx]);
            
            // Extract dynamic dominant stats
            const counts = {};
            mappedPredictions.forEach(c => counts[c] = (counts[c] || 0) + 1);
            let dominant = 'Shale';
            let maxCount = 0;
            Object.keys(counts).forEach(k => {
              if (counts[k] > maxCount) {
                maxCount = counts[k];
                dominant = k;
              }
            });

            setPredictionStats({
              dominantClass: dominant,
              dominantPercent: mappedPredictions.length > 0 ? ((maxCount / mappedPredictions.length) * 100).toFixed(1) + '%' : '0%',
              samplesCount: mappedPredictions.length,
              wellsCount: backendStatus?.dataset_info?.num_wells || 98,
              accuracy: data.metrics ? data.metrics.accuracy : 0.948
            });

            if (data.comparison_metrics && data.comparison_metrics.length > 0) {
              setBenchmarkScores(data.comparison_metrics);
            } else {
              setBenchmarkScores([
                { name: 'KNN', acc12: 'N/A', pen12: 'N/A', ham12: 'N/A', acc19: 'N/A', pen19: 'N/A', ham19: 'N/A' },
                { name: 'Random Forest ★', acc12: 'N/A', pen12: 'N/A', ham12: 'N/A', acc19: 'N/A', pen19: 'N/A', ham19: 'N/A' },
                { name: 'Decision Tree', acc12: 'N/A', pen12: 'N/A', ham12: 'N/A', acc19: 'N/A', pen19: 'N/A', ham19: 'N/A' },
                { name: 'XGBoost', acc12: 'N/A', pen12: 'N/A', ham12: 'N/A', acc19: 'N/A', pen19: 'N/A', ham19: 'N/A' },
                { name: 'LightGBM', acc12: 'N/A', pen12: 'N/A', ham12: 'N/A', acc19: 'N/A', pen19: 'N/A', ham19: 'N/A' }
              ]);
            }

            // Set dynamic curves and predictions structure
            setWellLogs({
              depth: data.well_data.DEPTH_MD,
              GR: data.well_data.GR || data.well_data.DEPTH_MD.map(() => 0),
              RHOB: data.well_data.RHOB || data.well_data.DEPTH_MD.map(() => 0),
              NPHI: data.well_data.NPHI || data.well_data.DEPTH_MD.map(() => 0),
              RMED: data.well_data.RMED || data.well_data.DEPTH_MD.map(() => 0),
              DTC: data.well_data.DTC || data.well_data.DEPTH_MD.map(() => 0),
              predictions: mappedPredictions,
              probabilities: data.probabilities,
              mismatches: data.mismatches,
              metrics: data.metrics,
              originalData: data.well_data
            });

            if (!silent) {
              setLoadingStep(4);
              setTimeout(() => {
                setAnalysisLoading(false);
                setCurrentRoute('results');
                setActiveTab('prediction');
                setLoadingStep(0);
              }, 300);
            }
          })
          .catch((err) => {
            if (interval) clearInterval(interval);
            console.error("Pipeline failure:", err);
            if (!silent && !isInitializing) {
              setAnalysisLoading(false);
              setLoadingStep(0);
              setUploadError(err.message || "An unexpected error occurred during pipeline execution.");
            }
            if (silent) return null;
            throw err;
          });
      };

      const handleFileChange = (e) => {
        const file = e.target.files[0];
        if (file) {
          setSelectedDatasetName(file.name);
          setSelectedWell('WELL_CUSTOM');
          setUploadedFile(file);
          setUploadError(null);
          executePipeline(file);
        }
      };

      // Load initial predictions on mount silently
      useEffect(() => {
        let wellToLoad = selectedWell;
        if (wellToLoad === 'WELL_CUSTOM' || wellToLoad === 'uploaded_well' || !wellToLoad) {
          wellToLoad = 'WELL_FORCE_2020_01';
          setSelectedWell('WELL_FORCE_2020_01');
          setSelectedDatasetName('Norway — FORCE 2020 Full');
        }
        
        executePipeline(null, true, wellToLoad).finally(() => {
          setIsInitializing(false);
        });
      }, []);

      // Auto re-run prediction if selectedModel, selectedFeatureSet, or selectedWell changes during results view
      useEffect(() => {
        if (currentRoute === 'results' && !isInitializing) {
          executePipeline();
        }
      }, [selectedModel, selectedFeatureSet, selectedWell, currentRoute, isInitializing]);

      // Helper function to return dynamic class distribution list for diagnostics tab
      const getClassDistributionData = () => {
        if (!wellLogs) {
          if (backendStatus && backendStatus.dataset_info && backendStatus.dataset_info.class_distribution) {
            return Object.entries(backendStatus.dataset_info.class_distribution).map(([key, count]) => {
              const idx = parseInt(key);
              return {
                name: LITHOLOGY_LABELS[idx] || `Class ${idx}`,
                count: count
              };
            }).sort((a, b) => b.count - a.count);
          }
          return [
            { name: 'Shale', count: 120300 },
            { name: 'Sandstone', count: 48900 },
            { name: 'Limestone', count: 24500 },
            { name: 'Chalk', count: 18500 },
            { name: 'Dolomite', count: 12400 },
            { name: 'Halite', count: 6800 },
            { name: 'Marl', count: 2100 },
            { name: 'Coal', count: 586 },
            { name: 'Basement', count: 16 }
          ];
        }

        // Count from wellLogs ground truth (LITHOLOGY) if present, otherwise predictions
        const counts = {};
        
        if (wellLogs.originalData && Array.isArray(wellLogs.originalData.LITHOLOGY)) {
          wellLogs.originalData.LITHOLOGY.forEach(val => {
            if (val !== null && val !== undefined && val >= 0) {
              const label = LITHOLOGY_LABELS[val] || `Class ${val}`;
              counts[label] = (counts[label] || 0) + 1;
            }
          });
        }
        
        // If counts is empty (e.g. no ground truth), count predictions
        if (Object.keys(counts).length === 0 && Array.isArray(wellLogs.predictions)) {
          wellLogs.predictions.forEach(label => {
            if (label) {
              counts[label] = (counts[label] || 0) + 1;
            }
          });
        }

        const list = Object.entries(counts).map(([name, count]) => ({
          name,
          count
        })).sort((a, b) => b.count - a.count);

        return list.length > 0 ? list : [
          { name: 'No Data', count: 0 }
        ];
      };


      // (External components now declared at outer scope to preserve React DOM states and prevent horizontal well log selection scroll resets on click)

      return (
        <div className="flex flex-col min-h-screen text-text-primary bg-void">

          {/* ==========================================
              GLOBAL FLOATING CAPSULE NAVBAR 
              ========================================== */}
          <header className="sticky top-0 z-50 w-full px-3 py-2 sm:px-6 sm:py-4 flex justify-center">
            {currentRoute === 'results' ? (
              // Results Full Navbar Layout with large, interactive, animated navigation links
              <div className="capsule-navbar w-full max-w-7xl flex items-center justify-between rounded-full px-4 py-3 sm:px-8 sm:py-4 border border-white/5 bg-surface/30 backdrop-blur-md">
                <div
                  className="hidden md:flex items-center gap-2 cursor-pointer group"
                  onClick={() => setCurrentRoute('landing')}
                >
                  <span className="text-xl text-accent-secondary group-hover:rotate-90 transition-all duration-500">◈</span>
                  <span className="font-heading font-extrabold tracking-wider text-lg text-white">LITHOFACIES ML</span>
                </div>

                {/* Tab Navigation Menu Options */}
                <div className="flex items-center gap-3 sm:gap-6 md:gap-10 text-[10px] sm:text-xs md:text-sm font-heading font-bold uppercase tracking-wider">
                  <button
                    onClick={() => setActiveTab('prediction')}
                    className={`relative py-1.5 sm:py-2.5 transition-all duration-300 hover:text-accent-secondary ${activeTab === 'prediction' ? 'text-accent-primary font-black scale-105' : 'text-text-secondary hover:scale-105'}`}
                  >
                    Prediction
                    {activeTab === 'prediction' ? (
                      <span className="absolute left-0 bottom-0 w-full h-[2px] bg-accent-primary shadow-[0_0_8px_#38B6FF] animate-pulse"></span>
                    ) : (
                      <span className="absolute left-0 bottom-0 w-0 h-[2px] bg-accent-primary/50 group-hover:w-full transition-all duration-300"></span>
                    )}
                  </button>
                  <button
                    onClick={() => setActiveTab('analysis')}
                    className={`relative py-1.5 sm:py-2.5 transition-all duration-300 hover:text-accent-secondary ${activeTab === 'analysis' ? 'text-accent-primary font-black scale-105' : 'text-text-secondary hover:scale-105'}`}
                  >
                    Data Analysis
                    {activeTab === 'analysis' ? (
                      <span className="absolute left-0 bottom-0 w-full h-[2px] bg-accent-primary shadow-[0_0_8px_#38B6FF] animate-pulse"></span>
                    ) : (
                      <span className="absolute left-0 bottom-0 w-0 h-[2px] bg-accent-primary/50 group-hover:w-full transition-all duration-300"></span>
                    )}
                  </button>
                  <button
                    onClick={() => setActiveTab('comparison')}
                    className={`relative py-1.5 sm:py-2.5 transition-all duration-300 hover:text-accent-secondary ${activeTab === 'comparison' ? 'text-accent-primary font-black scale-105' : 'text-text-secondary hover:scale-105'}`}
                  >
                    Model Comparison
                    {activeTab === 'comparison' ? (
                      <span className="absolute left-0 bottom-0 w-full h-[2px] bg-accent-primary shadow-[0_0_8px_#38B6FF] animate-pulse"></span>
                    ) : (
                      <span className="absolute left-0 bottom-0 w-0 h-[2px] bg-accent-primary/50 group-hover:w-full transition-all duration-300"></span>
                    )}
                  </button>
                </div>

                {/* Call-to-action Dynamic Actions */}
                <div className="flex items-center gap-2 sm:gap-4 text-xs font-mono">
                  <span className="bg-elevated border border-border-subtle px-2.5 py-1.5 sm:px-3 rounded-full text-accent-secondary text-[9px] sm:text-xs truncate max-w-[80px] sm:max-w-[120px] md:max-w-none block">
                    {selectedDatasetName}
                  </span>
                  <button
                    onClick={() => setCurrentRoute('upload')}
                    className="bg-accent-primary hover:bg-accent-primary/80 transition-colors text-void font-bold px-3 py-1.5 sm:px-5 sm:py-2.5 rounded-full font-heading uppercase tracking-wider text-[9px] sm:text-xs"
                  >
                    Re-upload
                  </button>
                </div>
              </div>
            ) : (
              // Landing & Upload Compact Centered Logo Capsule Layout - text a bit bigger
              <div className="capsule-navbar w-fit inline-flex items-center justify-center rounded-full px-5 py-3 sm:px-10 sm:py-4 border border-white/10 bg-surface/40 backdrop-blur-md shadow-[0_4px_30px_rgba(0,0,0,0.4)] transition-all duration-300 hover:border-white/20">
                <div
                  className="flex items-center gap-2.5 sm:gap-3 cursor-pointer group"
                  onClick={() => setCurrentRoute('landing')}
                >
                  <span className="text-xl sm:text-2xl text-accent-secondary group-hover:rotate-90 transition-all duration-500">◈</span>
                  <span className="font-heading font-black tracking-widest text-sm sm:text-lg md:text-xl text-white group-hover:text-accent-secondary transition-colors">LITHOFACIES ML</span>
                </div>
              </div>
